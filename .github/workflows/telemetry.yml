# Redraws the live parts of the profile README once a day:
#   telemetry.svg          stats panel (scripts/telemetry.mjs)
#   snake-dark/light.svg   contribution snake in the portfolio's lime
# Both are force-pushed to the orphan `output` branch, so main's history stays clean.
name: telemetry

on:
  schedule:
    - cron: "23 1 * * *" # 01:23 UTC daily (06:53 in Sri Lanka)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write # push to the output branch; nothing else

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draw telemetry panel
        run: node scripts/telemetry.mjs --out dist
        env:
          # optional: add a TELEMETRY_TOKEN secret (read-only PAT) to count private contributions
          GITHUB_TOKEN: ${{ secrets.TELEMETRY_TOKEN || github.token }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Draw contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#B6FF3B&color_dots=#161B22,#223311,#3A5E14,#6A9E22,#98D62F
            dist/snake-light.svg?palette=github-light&color_snake=#4F7A00&color_dots=#EBEDF0,#D8F0B0,#A8D95B,#7CB518,#4F7A00

      - name: Publish to the output branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "telemetry: $(date -u +%F)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
